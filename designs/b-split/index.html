<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="../preview.js"></script>
    <title>Divi</title>
    <meta name="description" content="Divi — split bills instantly, no app needed." />
    <meta name="theme-color" content="#2D2D2D" />
    <link rel="icon" href="../../assets/img/icon.png" />
    <link rel="apple-touch-icon" href="../../assets/img/icon.png" />
    <link rel="preload" as="image" href="../../assets/img/table.jpg" />
    <style>
      /* ==================================================================
         Divi — option B, "Split".
         Photo band with the DIVI wordmark across the top third. Below it
         the animation and the call to action sit side by side: a wide
         two-column composition on laptops and tablets, and a compact
         version on phones (animation beside the headline, buttons below).
         Gray is the default tone; white and sage override tokens only.
         ================================================================== */
      :root {
        --charcoal: #2D2D2D;
        --font: "Helvetica Neue", Helvetica, Inter, system-ui, -apple-system,
          Arial, sans-serif;
        --edge: clamp(1.25rem, 4vw, 3rem);
        /* The photo band: about a third of the screen. */
        --hero-h: clamp(7rem, 32svh, 25rem);

        --bg: #2D2D2D;
        --text: #F0EFED;
        --muted: #A3A09C;
        --accent: #6FAF8E;
        --accent-hover: #8CC4A5;
        --accent-ink: #6FAF8E;          /* sage as a line or as text */
        --link-hover: #8CC4A5;
        --on-accent: #2D2D2D;
        --outline-hover: rgba(111, 175, 142, 0.14);
        --rule: rgba(240, 239, 237, 0.09);
        --focus: #8CC4A5;
        --card-radius: 0px;
        --card-shadow: none;
        /* Gray has no card: the SVG's own background is the page colour.
           The illustration crops a plate at its right edge (17-33% down),
           so dissolve that edge instead of letting the plate stop on an
           invisible line. Two mask layers are unioned: the first keeps
           everything outside the plate's band fully visible, the second
           fades the right edge inside it. */
        --anim-mask:
          linear-gradient(to bottom, #000 13%, transparent 16.5%, transparent 34%, #000 37.5%),
          linear-gradient(90deg, #000 80%, rgba(0, 0, 0, 0.35) 92%, transparent);
      }

      html[data-tone="white"] {
        --bg: #FAFAF8;
        --text: #2D2D2D;
        --muted: #66635F;
        --accent: #6FAF8E;
        --accent-hover: #8CC4A5;
        --accent-ink: #3E7A5B;
        --link-hover: #3E7A5B;
        --on-accent: #2D2D2D;
        --outline-hover: rgba(62, 122, 91, 0.08);
        --rule: rgba(45, 45, 45, 0.10);
        --focus: #3E7A5B;
        --card-radius: 20px;
        --card-shadow: 0 1px 2px rgba(45, 45, 45, 0.08),
          0 14px 28px -10px rgba(45, 45, 45, 0.30),
          0 34px 60px -24px rgba(45, 45, 45, 0.28);
        --anim-mask: none;
      }

      html[data-tone="sage"] {
        --bg: #24382E;
        --text: #F0EFED;
        --muted: #A9BDB2;
        --accent: #6FAF8E;
        --accent-hover: #8CC4A5;
        --accent-ink: #6FAF8E;
        --link-hover: #8CC4A5;
        --on-accent: #1E2A24;
        --outline-hover: rgba(111, 175, 142, 0.16);
        --rule: rgba(240, 239, 237, 0.10);
        --focus: #8CC4A5;
        --card-radius: 20px;
        --card-shadow: 0 0 0 1px rgba(240, 239, 237, 0.07),
          0 16px 32px -12px rgba(0, 0, 0, 0.45),
          0 36px 64px -28px rgba(0, 0, 0, 0.50);
        --anim-mask: none;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html {
        -webkit-text-size-adjust: 100%;
        background: var(--bg);
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        font-size: 16px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }

      :focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      /* ------------------------------------------------------------------
         Photo band — the original hero, reduced to a third of the screen.
         ------------------------------------------------------------------ */
      .hero {
        position: relative;
        flex: none;
        height: var(--hero-h);
        display: grid;
        place-items: center;
        overflow: hidden;
        isolation: isolate;
        background: #0b0b0b;
      }

      .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background:
          linear-gradient(
            to bottom,
            rgba(11, 11, 11, 0.62) 0%,
            rgba(11, 11, 11, 0.42) 30%,
            rgba(11, 11, 11, 0.42) 66%,
            rgba(11, 11, 11, 0.72) 100%
          ),
          url("../../assets/img/table.jpg") center 46% / cover no-repeat;
      }

      .masthead {
        position: absolute;
        top: 0;
        left: 0;
        padding: min(var(--edge), 5.5svh) var(--edge);
      }

      .mark {
        display: block;
        line-height: 0;
        border-radius: 10px;
      }

      .mark:focus-visible {
        outline-color: #fff;
      }

      .mark img {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        display: block;
        object-fit: cover;
        transition: opacity 0.2s ease;
      }

      .mark:hover img {
        opacity: 0.75;
      }

      .wordmark {
        margin: 0;
        font-size: clamp(2.75rem, min(22vw, 16svh), 10rem);
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.12em;
        /* letter-spacing pads the right edge; pull it back so DIVI centres. */
        text-indent: 0.12em;
        text-transform: uppercase;
        color: #fff;
        white-space: nowrap;
        text-shadow: 0 2px 24px rgba(0, 0, 0, 0.25);
      }

      /* ------------------------------------------------------------------
         Lower area, phone first. The stage (animation beside the headline)
         is the flexible piece; buttons, hint and footer keep their height.
         ------------------------------------------------------------------ */
      .lower {
        --pad-y: clamp(0.875rem, 2.6svh, 1.75rem);
        --col-gap: clamp(0.875rem, 4.2vw, 1.5rem);
        --col-min: 6.75rem;
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        gap: clamp(0.875rem, 2.6svh, 1.5rem);
        padding: var(--pad-y) var(--edge) clamp(0.75rem, 2.2svh, 1.25rem);
      }

      .stage {
        flex: 1 1 0;
        min-height: 10rem;
        container-type: size;
        display: grid;
        align-items: center;
      }

      /* Card on the left; headline and Replay share the column beside it.
         The 1fr row makes Replay line up with the card's bottom edge. */
      .split {
        display: grid;
        grid-template-columns: auto minmax(var(--col-min), 1fr);
        grid-template-rows: 1fr auto;
        column-gap: var(--col-gap);
      }

      .unit {
        display: contents;
      }

      .frame {
        grid-column: 1;
        grid-row: 1 / span 2;
        /* First value: browsers without container units (pre-iOS 16). */
        height: min(36vh, (100vw - 2 * var(--edge) - var(--col-min) - var(--col-gap)) * 655 / 530);
        height: min(100cqh, (100cqw - var(--col-min) - var(--col-gap)) * 655 / 530, 36rem);
        aspect-ratio: 530 / 655;
        background: var(--charcoal);
        border-radius: var(--card-radius);
        box-shadow: var(--card-shadow);
        overflow: hidden;
      }

      .frame img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        -webkit-mask-image: var(--anim-mask);
        mask-image: var(--anim-mask);
      }

      .pitch {
        grid-column: 2;
        grid-row: 1;
        align-self: center;
        min-width: 0;
      }

      .rule {
        display: block;
        width: 2rem;
        height: 3px;
        margin-bottom: clamp(0.625rem, 1.8svh, 1rem);
        border-radius: 3px;
        background: var(--accent);
      }

      .prompt {
        margin: 0;
        font-size: clamp(1.25rem, 6.2vw, 1.75rem);
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }

      .replay {
        grid-column: 2;
        grid-row: 2;
        justify-self: start;
        position: relative;
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        min-height: 2.75rem;
        /* Padding gives the focus ring room; the negative margin keeps the
           icon on the headline's left edge. */
        margin-left: -0.5rem;
        padding: 0 0.5rem;
        border: 0;
        background: none;
        color: var(--muted);
        font: 500 0.8125rem/1 var(--font);
        letter-spacing: 0.02em;
        cursor: pointer;
        transition: color 0.2s ease;
      }

      .replay svg {
        width: 16px;
        height: 16px;
        flex: none;
      }

      .replay:hover {
        color: var(--link-hover);
      }

      .replay:focus-visible {
        outline-offset: 2px;
        border-radius: 6px;
      }

      .actions {
        flex: none;
      }

      .buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 0.625rem;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        min-height: 2.875rem;
        padding: 0 clamp(0.875rem, 4vw, 1.25rem);
        border: 2px solid transparent;
        border-radius: 999px;
        font-size: 0.9375rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.02em;
        white-space: nowrap;
        text-decoration: none;
        transition: background-color 0.2s ease, border-color 0.2s ease,
          transform 0.15s ease;
      }

      .buttons .btn {
        flex: 1 1 0;
        max-width: 15rem;
      }

      .btn svg {
        width: 20px;
        height: 20px;
        flex: none;
      }

      .btn:active {
        transform: scale(0.97);
      }

      .btn-wa {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--on-accent);
      }

      .btn-wa:hover {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }

      .btn-im {
        color: var(--text);
        border-color: var(--accent-ink);
      }

      .btn-im:hover {
        background: var(--outline-hover);
      }

      /* Narrow screens show "WhatsApp" / "iMessage"; the full name stays in
         the accessible name. From 560px both full labels fit side by side. */
      .long {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      .hint {
        margin: clamp(0.5rem, 1.4svh, 0.875rem) 0 0;
        max-width: 36ch;
        font-size: 0.8125rem;
        line-height: 1.45;
        color: var(--muted);
        text-wrap: pretty;
      }

      /* ------------------------------------------------------------------
         Footer. Phones: email and links on one line, copyright below.
         Order matches the source, so focus order matches what you see.
         ------------------------------------------------------------------ */
      .footer {
        flex: none;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.125rem 1.125rem;
        padding: 0.625rem var(--edge) 0.75rem;
        border-top: 1px solid var(--rule);
        font-size: 0.75rem;
        line-height: 1.5;
        letter-spacing: 0.02em;
        color: var(--muted);
      }

      .footer-group {
        display: contents;
      }

      .footer a {
        position: relative;
        color: var(--text);
        text-decoration: none;
        transition: color 0.2s ease;
      }

      .footer a:hover {
        color: var(--link-hover);
      }

      /* A finger-sized hit area without changing the layout. */
      .footer a::after {
        content: "";
        position: absolute;
        inset: -0.75rem -0.375rem;
      }

      .footer .copyright {
        order: 1;
        flex-basis: 100%;
      }

      @media (max-width: 699px) {
        :root {
          --hero-h: clamp(7rem, 29svh, 20rem);
        }

        /* Nudge DIVI clear of the icon in the shorter phone band. */
        .hero {
          padding-top: 1rem;
        }
      }

      /* Engines without svh (before Safari 15.4 / Chrome 108): a custom
         property holding an unknown unit would leave the band unsized. */
      @supports not (height: 1svh) {
        :root {
          --hero-h: clamp(7rem, 32vh, 25rem);
        }

        @media (max-width: 699px) {
          :root {
            --hero-h: clamp(7rem, 29vh, 20rem);
          }
        }
      }

      @media (max-width: 479px) {
        .mark img {
          width: 36px;
          height: 36px;
        }
      }

      @media (min-width: 560px) {
        .long {
          position: static;
          width: auto;
          height: auto;
          margin: 0;
          overflow: visible;
          clip: auto;
        }

        .buttons .btn {
          flex: none;
          max-width: none;
        }
      }

      /* ------------------------------------------------------------------
         The wide split: animation on the left, call to action on the
         right, the pair centred under the wordmark.
         ------------------------------------------------------------------ */
      @media (min-width: 700px),
        (min-width: 560px) and (orientation: landscape) and (max-height: 500px) {
        .lower {
          --pad-y: clamp(1rem, 3.6svh, 2.75rem);
          --replay-row: 2.25rem;
          flex: 1 1 0;
          min-height: 19rem;
          container-type: size;
          display: grid;
          grid-template-columns: auto minmax(0, 33rem);
          grid-template-rows: 1fr auto auto 1fr;
          grid-template-areas:
            "unit ."
            "unit pitch"
            "unit actions"
            "unit .";
          justify-content: center;
          column-gap: clamp(2rem, 6.5vw, 6.5rem);
          padding: 0 var(--edge);
        }

        .stage,
        .split {
          display: contents;
          container-type: normal;
        }

        .unit {
          grid-area: unit;
          align-self: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 0.375rem;
        }

        .frame {
          height: auto;
          width: min(40vh, 44vw, 32rem);
          width: min(
            (100cqh - 2 * var(--pad-y) - var(--replay-row)) * 530 / 655,
            50cqw,
            32rem
          );
        }

        .pitch {
          grid-area: pitch;
        }

        .actions {
          grid-area: actions;
        }

        .replay {
          min-height: 1.875rem;
          margin-left: 0;
          padding: 0 0.625rem;
        }

        /* Keeps a finger-sized target on touch tablets without growing
           the row the animation's size is worked out from. */
        .replay::after {
          content: "";
          position: absolute;
          inset: -0.4375rem 0;
        }

        .rule {
          width: 2.5rem;
          margin-bottom: clamp(1rem, 2.6svh, 1.5rem);
        }

        .prompt {
          font-size: clamp(1.75rem, 1rem + 2.4vw, 3.25rem);
          line-height: 1.06;
          letter-spacing: -0.02em;
          max-width: 11ch;
        }

        .buttons {
          display: grid;
          grid-template-columns: repeat(auto-fit, minmax(15.25rem, 1fr));
          gap: 0.75rem;
          margin-top: clamp(1.25rem, 3.4svh, 2rem);
        }

        .btn {
          min-height: 3rem;
          padding: 0 1.25rem;
        }

        .hint {
          margin-top: clamp(0.875rem, 2.4svh, 1.375rem);
          font-size: 0.9375rem;
          max-width: 38ch;
        }
      }

      /* One-row footer once the four items fit side by side (~700px). */
      @media (min-width: 700px) {
        .footer {
          justify-content: space-between;
          gap: 0.5rem 2.25rem;
          padding: 1rem var(--edge);
          font-size: 0.8125rem;
          letter-spacing: 0.04em;
        }

        .footer-group {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 0.5rem 2.25rem;
        }

        .footer .copyright {
          order: 0;
          flex-basis: auto;
        }

        .footer a::after {
          inset: -0.5rem -0.25rem;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition: none !important;
        }

        .btn:active {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero" data-check="hero">
      <div class="masthead">
        <a class="mark" href="./" aria-label="Divi — home">
          <img data-check="icon" src="../../assets/img/icon.png" alt="" width="44" height="44" />
        </a>
      </div>
      <h1 class="wordmark" data-check="wordmark">Divi</h1>
    </header>

    <main class="lower">
      <div class="stage">
        <div class="split">
          <div class="unit">
            <div class="frame">
              <img
                id="anim"
                data-check="anim"
                src="../../assets/img/divi-web-charcoal-sage.svg"
                alt="How Divi works: snap the receipt, everyone scans, tap what you had, settle up."
                width="530"
                height="655"
              />
            </div>
            <button class="replay" id="replay" type="button" data-check="replay">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
              Replay
            </button>
          </div>
          <div class="pitch">
            <span class="rule" aria-hidden="true"></span>
            <h2 class="prompt" data-check="prompt">Text us to split your bill</h2>
          </div>
        </div>
      </div>

      <div class="actions">
        <div class="buttons">
          <a class="btn btn-wa" data-check="whatsapp" href="https://wa.me/14785004378" target="_blank" rel="noopener noreferrer">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51l-.57-.01c-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            <span><span class="long">Text Through </span>WhatsApp</span>
          </a>
          <a class="btn btn-im" data-check="imessage" href="sms:+14785004378">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/><path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/></svg>
            <span><span class="long">Text Through </span>iMessage</span>
          </a>
        </div>
        <p class="hint" data-check="hint">Text us and we'll send you a link to start splitting — no download required.</p>
      </div>
    </main>

    <footer class="footer" data-check="footer">
      <div class="footer-group">
        <span class="copyright" data-check="copyright">&copy; 2026 Divi. All rights reserved.</span>
        <a data-check="email" href="mailto:hello@justdivi.com">hello@justdivi.com</a>
      </div>
      <div class="footer-group">
        <a data-check="tos" href="/tos">Terms of Service</a>
        <a data-check="privacy" href="/privacy">Privacy Policy</a>
      </div>
    </footer>

    <script>
      // Replay: give the SVG a fresh URL (cache-buster), which reloads it and
      // restarts its animation timeline from zero.
      (function () {
        var anim = document.getElementById('anim');
        document.getElementById('replay').addEventListener('click', function () {
          var src = anim.src.split('?')[0];
          anim.src = src + '?' + Date.now();
        });
      })();
    </script>
  </body>
</html>
