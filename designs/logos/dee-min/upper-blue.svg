<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Divi">
  <title>Divi</title>
  <!-- dee-min / uppercase D: two strokes, a straight stem and one round arc whose round-capped tips curl back and rest on the stem (Cologne-style tubes that touch, no gap, no corner). -->
  <defs>
    <linearGradient id="tile-g" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DEF8FB"/>
      <stop offset="1" stop-color="#A6E5F7"/>
    </linearGradient>
    <linearGradient id="ink" x1="52" y1="192" x2="222" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1151FE"/>
      <stop offset="1" stop-color="#05DFF2"/>
    </linearGradient>
  </defs>
  <rect id="tile" width="256" height="256" fill="url(#tile-g)"/>
  <g fill="none" stroke="url(#ink)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <path d="M69.32 52V204"/>
    <path d="M85.32 60.9A76 76 0 1 1 85.32 195.1"/>
  </g>
</svg>
