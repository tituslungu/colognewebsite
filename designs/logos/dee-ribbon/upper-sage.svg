<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Divi">
  <title>Divi</title>
  <!-- dee-ribbon, uppercase D: the Cologne C mirrored into a bowl and closed with a straight stem.
       Measured from the C: stroke ~17 and lines ~37 apart at a 211-unit letter; here stroke 16, lines 35
       apart (centre to centre) at a 195-unit letter, hairpin turns of radius 17.5.
       1 the ribbon: outer line round the bowl, hairpin turns at both stem corners, inner line back
         (the C's terminal hooks, now sitting in the corners);
       2 the stem, tangent to both hairpins so each corner is one rounded loop;
       3 the crescent line (r102.76): it crosses the outer line at 28 degrees just where the bar turns into the
         bowl, as the C's inner swing does near its top, and kisses the inner bowl at its far right. The
         crescent of space it leaves on the right is the C's left-side stress, mirrored.
       Gradient: deep at lower left to light at upper right, tilted 28 degrees, fixed in tile space so
       overlapping strokes never show seams. Ink centroid sits on the tile centre; all ink within r116. -->
  <defs>
    <linearGradient id="tile-g" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FAFAF8"/>
      <stop offset="1" stop-color="#ECEBE8"/>
    </linearGradient>
    <linearGradient id="ink" x1="43.72" y1="175.47" x2="218.03" y2="82.79" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E7A5B"/>
      <stop offset="1" stop-color="#8CC4A5"/>
    </linearGradient>
  </defs>
  <rect id="tile" width="256" height="256" fill="url(#tile-g)"/>
  <g fill="none" stroke="url(#ink)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56.5 56 A17.5 17.5 0 0 1 74 38.5 H120 A89.5 89.5 0 0 1 120 217.5 H74 A17.5 17.5 0 0 1 56.5 200 A17.5 17.5 0 0 1 74 182.5 H120 A54.5 54.5 0 0 0 120 73.5 H74 A17.5 17.5 0 0 1 56.5 56 Z"/>
    <path d="M56.5 56 V200"/>
    <path d="M122.28 38.53 A102.76 102.76 0 0 1 122.28 217.47"/>
  </g>
</svg>
