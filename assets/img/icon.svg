<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Divi</title>
  <!-- The Divi mark: a white, round-capped D drawn as one line that stops just short of
       closing, on a sage tile. Source concept: designs/logos/dee-mono (uppercase, white on sage). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6FAF8E"/>
      <stop offset="1" stop-color="#3E7A5B"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" fill="url(#tile)"/>
  <path d="M69.5 46V174.73A35 35 0 0 0 100.78 209.53A82 82 0 1 0 109.5 46" fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
