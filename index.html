    <script>
      const PAGES = 5;
      const DURATION = 17.4;
      // Page visibility windows (fraction of total duration)
      const PAGE_TIMES = [
        [0, 0.22414],
        [0.22414, 0.43103],
        [0.43103, 0.67241],
        [0.67241, 0.86782],
        [0.86782, 1.0]
      ];

      const obj = document.getElementById('anim');
      const dots = document.querySelectorAll('.dot');
      const replayBtn = document.getElementById('replay');
      let autoTracker = null;
      let manualMode = false;

      function getSvgDoc() {
        try { return obj.contentDocument; } catch(e) { return null; }
      }

      function updateDots(active) {
        dots.forEach((d, i) => {
          d.classList.toggle('active', i === active);
        });
      }

      // Track which page is showing during auto-play
      function startTracking() {
        manualMode = false;
        const start = Date.now();
        if (autoTracker) clearInterval(autoTracker);
        autoTracker = setInterval(() => {
          if (manualMode) return;
          const elapsed = (Date.now() - start) / 1000;
          const frac = Math.min(elapsed / DURATION, 1);
          for (let i = PAGES - 1; i >= 0; i--) {
            if (frac >= PAGE_TIMES[i][0]) {
              updateDots(i);
              break;
            }
          }
          if (frac >= 1) clearInterval(autoTracker);
        }, 200);
      }

      // Jump to a specific page
      function goToPage(pageIndex) {
        manualMode = true;
        if (autoTracker) clearInterval(autoTracker);
        const svgDoc = getSvgDoc();
        if (!svgDoc) return;

        // Pause all animations and set page visibility
        for (let i = 0; i < PAGES; i++) {
          const els = svgDoc.querySelectorAll('.pg' + i);
          els.forEach(el => {
            el.style.animation = 'none';
            el.style.opacity = i === pageIndex ? '1' : '0';
          });
        }

        // Also freeze other decorative animations
        const allAnimated = svgDoc.querySelectorAll('[class]');
        allAnimated.forEach(el => {
          const cls = el.getAttribute('class') || '';
          if (!cls.match(/^pg\d$/)) {
            el.style.animationPlayState = 'paused';
          }
        });

        updateDots(pageIndex);
      }

      // Replay the full animation
      function replay() {
        manualMode = false;
        // Reload the SVG by resetting the data attribute
        const src = obj.getAttribute('data');
        obj.setAttribute('data', '');
        requestAnimationFrame(() => {
          obj.setAttribute('data', src);
          obj.onload = () => startTracking();
        });
        updateDots(0);
      }

      dots.forEach(dot => {
        dot.addEventListener('click', () => {
          goToPage(parseInt(dot.dataset.page));
        });
      });

      replayBtn.addEventListener('click', replay);

      obj.addEventListener('load', () => startTracking());
    </script>
