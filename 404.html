<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Not found — Divi</title>
    <meta name="theme-color" content="#2D2D2D" />
    <link rel="icon" href="/assets/img/icon.png" sizes="512x512" type="image/png" />
    <link rel="icon" href="/assets/img/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/assets/img/icon.png" />
    <link rel="preload" as="image" href="/assets/img/table.jpg" />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <style>
      /* No card here: the message sits centred in the panel, starting
         below the end of the fade. */
      .notfound {
        flex: 1 1 auto;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding-block: calc(var(--fade-end) - var(--hero-h)) clamp(0.5rem, 2vh, 1.5rem);
      }

      .notfound-code {
        margin: 0;
        font-size: clamp(3.5rem, min(24vw, 15vh), 8rem);
        line-height: 1;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-indent: 0.06em;
        color: var(--prompt);
      }

      .notfound-text {
        margin: clamp(0.4rem, 1.4vh, 0.9rem) 0 0;
        font-size: clamp(1.0625rem, 2.6vh, 1.375rem);
        font-weight: 600;
        line-height: 1.3;
      }

      .notfound .btn {
        flex: none;
        max-width: none;
        margin-top: clamp(1rem, 3vh, 1.75rem);
        --b-bg: var(--charcoal);
        --b-line: var(--charcoal);
        --b-ink: #fff;
        --b-bg-hover: #474747;
        --b-line-hover: #474747;
        --b-ink-hover: #fff;
        --b-ring: var(--focus);
      }

      /* Wide: left-set under DIVI, like the homepage's call to action */
      @media (min-width: 900px) and (min-aspect-ratio: 5/4),
        (min-width: 560px) and (orientation: landscape) and (max-height: 520px) {
        .notfound {
          align-items: flex-start;
          text-align: left;
        }

        .notfound-code {
          font-size: clamp(3rem, min(11vw, 17vh), 10rem);
          text-indent: 0;
          margin-left: -0.04em;
        }
      }

      /* Short landscape phones: the message and button sit beside the
         404 instead of under it, so the page still fits one screen. */
      @media (max-height: 520px) and (orientation: landscape) {
        .notfound {
          display: grid;
          grid-template-columns: auto auto;
          justify-content: center;
          align-content: center;
          align-items: center;
          column-gap: clamp(1.25rem, 4vw, 2.5rem);
          text-align: left;
        }

        .notfound-code {
          grid-row: 1 / span 2;
        }

        .notfound-text {
          align-self: end;
          margin: 0;
        }

        .notfound .btn {
          align-self: start;
          justify-self: start;
          margin-top: 0.75rem;
        }
      }

      @media (min-width: 560px) and (orientation: landscape) and (max-height: 520px) {
        .notfound {
          justify-content: start;
        }
      }
    </style>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <div class="photo photo-soft"><div class="photo-edge"></div><div></div></div>
      <div class="photo photo-sharp"><div></div></div>
      <div class="scrim"></div>
      <div class="tint"></div>
    </div>

    <header class="hero">
      <div class="hero-inner wrap">
        <a class="mark" href="/" aria-label="Divi — home">
          <img src="/assets/img/icon.svg" alt="" width="44" height="44" />
        </a>
        <div class="wordmark-row">
          <p class="wordmark">Divi</p>
        </div>
      </div>
    </header>

    <main class="notfound wrap">
      <h1 class="notfound-code">404</h1>
      <p class="notfound-text">That page doesn&rsquo;t exist.</p>
      <a class="btn" href="/">Back to the homepage</a>
    </main>

    <footer class="footer">
      <div class="footer-inner wrap">
        <div class="footer-group footer-legal">
          <span class="copyright">&copy; 2026 Divi. All rights reserved.</span>
          <a href="mailto:hello@justdivi.com">hello@justdivi.com</a>
        </div>
        <div class="footer-group footer-links">
          <a href="/tos">Terms of Service</a>
          <a href="/privacy">Privacy Policy</a>
        </div>
      </div>
    </footer>
  </body>
</html>
